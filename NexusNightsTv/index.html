<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: http: file: $WEBAPIS; script-src 'self' 'unsafe-inline' blob: https: file: $WEBAPIS; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: http: blob:; media-src 'self' data: blob: https: http:; connect-src 'self' blob: data: https: http:; frame-src https: http:; font-src 'self' data: https:; object-src 'self' data:;">
    <title>NexusNights</title>
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Root Container -->
    <div id="app" class="app-container">
        <!-- Loading Screen -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-logo-crest">
                <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                    <path d="M24 4L44 14V34L24 44L4 34V14L24 4Z" stroke="#B3202F" stroke-width="2.5" fill="rgba(179,32,47,0.14)"/>
                    <path d="M16 15V33L32 15V33" stroke="#F5F6F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="24" cy="24" r="3" fill="#D4AF6A"/>
                </svg>
            </div>
            <div class="loading-wordmark">NEXUSNIGHTS</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>

        <!-- Top Tab Bar (streaming-platform shell) -->
        <header id="nav-tabs" class="nav-tabs hidden">
            <div class="nav-crest" title="NexusNights">
                <svg width="40" height="40" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                    <path d="M24 4L44 14V34L24 44L4 34V14L24 4Z" stroke="#B3202F" stroke-width="2.5" fill="rgba(179,32,47,0.16)"/>
                    <path d="M16 15V33L32 15V33" stroke="#F5F6F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="24" cy="24" r="3" fill="#D4AF6A"/>
                </svg>
            </div>

            <ul class="nav-tab-list" role="tablist">
                <li class="tab focusable" data-page="home" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </span>
                    <span class="tab-label">الرئيسية</span>
                </li>
                <li class="tab focusable" data-page="movies" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                    </span>
                    <span class="tab-label">أفلام</span>
                </li>
                <li class="tab focusable" data-page="series" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
                    </span>
                    <span class="tab-label">مسلسلات</span>
                </li>
                <li class="tab focusable" data-page="sports" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3.5 3 14.5 0 18"/><path d="M12 3c-3 3.5-3 14.5 0 18"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
                    </span>
                    <span class="tab-label">رياضة</span>
                </li>
                <li class="tab focusable" data-page="search" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
                    </span>
                    <span class="tab-label">بحث</span>
                </li>
                <li class="tab focusable" data-page="settings" role="tab" tabindex="0">
                    <span class="tab-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </span>
                    <span class="tab-label">إعدادات</span>
                </li>
            </ul>

            <div class="nav-trailing">
                <div class="live-chip hidden" id="nav-live-chip" aria-live="polite">
                    <span class="live-dot" aria-hidden="true"></span>
                    <span class="live-chip-text" id="nav-live-text"></span>
                </div>
                <div class="nav-clock" id="nav-clock" aria-label="Current time"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content hidden">
            <!-- Pages will be injected here -->
        </main>
    </div>

    <!-- Core JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/hls.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/player.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/movies.js"></script>
    <script src="js/pages/series.js"></script>
    <script src="js/pages/sports.js"></script>
    <script src="js/pages/search.js"></script>
    <script src="js/pages/details.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
