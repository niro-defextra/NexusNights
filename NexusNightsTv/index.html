        <div id="loading-screen" class="loading-screen">

            </div>
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>

                    </span>
                    <span class="menu-label">الرئيسية</span>
                </li>
                <li class="menu-item focusable" data-page="movies" tabindex="0">
                    <span class="menu-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                    </span>

                </li>
                <li class="menu-item focusable" data-page="series" tabindex="0">

                    </span>

                <li class="menu-item focusable" data-page="sports" tabindex="0">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>

                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content hidden">
            <!-- Pages will be injected here -->
        </main>
    </div>

    <!-- Core JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/hls.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/player.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/movies.js"></script>
    <script src="js/pages/series.js"></script>

</body>
</html>


    <!-- Debug script -->
    <script>
        // Debug logging
        console.log('=== NEXUSNIGHT TV DEBUG ===');
        console.log('Document readyState:', document.readyState);
        console.log('Script loading order:');
        
        // Track script loading
        var scripts = document.querySelectorAll('script[src]');
        scripts.forEach(function(script, i) {
            console.log(i + 1 + '. ' + script.src.split('/').pop());
        });
        
        // Check for NexusConfig after a short delay
        setTimeout(function() {
            console.log('=== Post-load check ===');
            console.log('NexusConfig:', typeof NexusConfig !== 'undefined' ? '✓ Loaded' : '✗ Missing');
            console.log('NexusAPI:', typeof NexusAPI !== 'undefined' ? '✓ Loaded' : '✗ Missing');
            console.log('FocusManager:', typeof FocusManager !== 'undefined' ? '✓ Loaded' : '✗ Missing');
            console.log('Navigator:', typeof Navigator !== 'undefined' ? '✓ Loaded' : '✗ Missing');
        }, 500);
    </script>
